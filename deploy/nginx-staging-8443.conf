# Giggit staging — a full copy of the portal on port 3005, own data volume.
# Same paths as live, same cert, different port. No app changes needed.
# Install: cp to /etc/nginx/sites-enabled/taig-staging, nginx -t, reload.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name taigtsp.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/taigtsp.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taigtsp.duckdns.org/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
