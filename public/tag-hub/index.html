<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="application-name" content="Tag Hub">
<meta name="apple-mobile-web-app-title" content="Tag Hub">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<title>Tag Hub — TAIG</title>
<style>
  :root { --navy:#182941; --gold:#CDA140; --cream:#F5F1E8; --ink:#1c2b3a; --muted:#5b6b7c; --line:#d8d2c4; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--cream); }
  #app { display:flex; height:100vh; }
  /* ---- sidebar ---- */
  #side { width:248px; flex:0 0 248px; background:var(--navy); color:#fff; display:flex; flex-direction:column; overflow-y:auto; }
  #side .brand { padding:18px 18px 10px; border-bottom:1px solid rgba(255,255,255,.14); }
  #side .brand h1 { margin:0; font-size:22px; letter-spacing:.5px; }
  #side .brand h1 span { color:var(--gold); }
  #side .brand p { margin:4px 0 0; font-size:12px; color:#b9c4d0; }
  #side nav { padding:10px 0 16px; flex:1; }
  #side .nav-label { padding:14px 18px 5px; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--gold); }
  #side a { display:block; padding:8px 18px; color:#e8edf2; text-decoration:none; font-size:14px; line-height:1.35; }
  #side a:hover { background:rgba(255,255,255,.08); }
  #side a.active { background:rgba(205,161,64,.22); border-left:3px solid var(--gold); color:#fff; }
  #side a.sub { padding-left:34px; font-size:13px; color:#c3ced9; }
  #side a.filed { padding-left:34px; font-size:13px; color:#c3ced9; }
  #side a.filed::before { content:"· "; color:var(--gold); }
  #side .note { padding:12px 18px; font-size:12px; color:#93a2b1; border-top:1px solid rgba(255,255,255,.14); }
  /* ---- main ---- */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #topbar { background:#fff; border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #menuBtn { display:none; }
  #closeBtn { display:none; }
  #scrim { display:none; }
  #crumb { font-size:14px; font-weight:600; color:var(--navy); }
  #deeplink { flex:1; min-width:220px; font-size:12px; padding:6px 8px; border:1px solid var(--line); border-radius:4px; color:var(--muted); background:var(--cream); }
  #copyBtn { font-size:12px; padding:6px 12px; border:1px solid var(--navy); background:var(--navy); color:#fff; border-radius:4px; cursor:pointer; }
  #copyBtn:hover { background:#243a52; }
  #pane { flex:1; position:relative; min-height:0; }
  #viewer { width:100%; height:100%; border:0; display:block; background:#fff; }
  #storeview { position:absolute; inset:0; overflow-y:auto; padding:24px; display:none; background:var(--cream); }
  #storeview.show { display:block; }
  #viewer.hide { display:none; }
  .wrap { max-width:1020px; margin:0 auto; }
  .wrap h2 { color:var(--navy); margin:0 0 4px; font-size:24px; }
  .wrap .lede { color:var(--muted); margin:0 0 20px; font-size:14px; }
  .group-h { color:var(--navy); border-bottom:2px solid var(--gold); padding-bottom:4px; margin:26px 0 12px; font-size:17px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:12px; }
  .card h3 { margin:0 0 6px; color:var(--navy); font-size:16px; }
  .card h3 a { color:var(--navy); text-decoration:none; }
  .card h3 a:hover { text-decoration:underline; }
  .card p.truth { margin:0 0 10px; font-size:14px; line-height:1.5; }
  .card .meta { font-size:12px; color:var(--muted); }
  .card .meta b { color:var(--navy); }
  .card .links { margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .card .links a.open { font-size:13px; color:var(--navy); font-weight:600; }
  .card .links button { font-size:12px; padding:4px 10px; border:1px solid var(--navy); background:#fff; color:var(--navy); border-radius:4px; cursor:pointer; }
  .revs { margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; }
  .revs h4 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .rev { font-size:13px; line-height:1.5; margin-bottom:6px; }
  .rev .tag { display:inline-block; background:var(--gold); color:var(--navy); font-size:11px; font-weight:700; padding:1px 7px; border-radius:10px; margin-right:6px; }
  .rev s { color:var(--muted); }
  .empty { color:var(--muted); font-size:14px; }
  /* ---- landing ---- */
  .landing { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:20px; align-items:start; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:16px; }
  .panel h3 { margin:0 0 4px; color:var(--navy); font-size:17px; }
  .panel .sub { margin:0 0 12px; font-size:12px; color:var(--muted); }
  .panel .foot { margin:12px 0 0; font-size:13px; }
  .panel .foot a { color:var(--navy); font-weight:600; }
  .cal-frame { width:100%; height:440px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .attn-group { margin-bottom:14px; }
  .attn-group h4 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--navy); }
  .attn-item { padding:10px 0; border-top:1px solid var(--line); }
  .attn-item:first-of-type { border-top:0; }
  .attn-item a.t { color:var(--navy); font-weight:600; font-size:14px; text-decoration:none; }
  .attn-item a.t:hover { text-decoration:underline; }
  .attn-item p { margin:4px 0 0; font-size:13px; color:var(--muted); line-height:1.45; }
  .sport-sub { margin:16px 0 8px; font-size:14px; color:var(--navy); border-bottom:1px solid var(--line); padding-bottom:4px; }
  .sport-sub:first-of-type { margin-top:0; }
  .fixture { padding:8px 0; border-top:1px solid var(--line); font-size:14px; line-height:1.45; }
  .fixture:first-of-type { border-top:0; }
  .fixture b { color:var(--navy); }
  .fixture .when { color:var(--muted); font-size:13px; }
  .news-item { padding:8px 0; border-top:1px solid var(--line); font-size:14px; line-height:1.45; }
  .news-item:first-of-type { border-top:0; }
  .news-item a { color:var(--navy); text-decoration:none; font-weight:600; }
  .news-item a:hover { text-decoration:underline; }
  .news-item .src { color:var(--muted); font-size:12px; }
  .tile { display:block; background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px; text-decoration:none; }
  .tile:hover { border-color:var(--gold); }
  .tile b { display:block; color:var(--navy); font-size:15px; }
  .tile .date { display:block; color:var(--gold); font-size:12px; font-weight:700; margin-top:2px; }
  .tile .latest { display:block; color:var(--muted); font-size:13px; margin-top:6px; line-height:1.4; }
  .port-card { display:block; background:var(--navy); border-radius:8px; padding:16px; margin-bottom:16px; text-decoration:none; }
  .port-card b { display:block; color:#fff; font-size:16px; }
  .port-card span { display:block; color:#b9c4d0; font-size:13px; margin-top:4px; line-height:1.45; }
  .port-card .go { display:block; color:var(--gold); font-size:13px; font-weight:700; margin-top:8px; }
  @media (max-width:900px) { .landing { grid-template-columns:1fr; } }
  @media (max-width:760px) {
    #app { flex-direction:column; }
    #menuBtn { display:block; font-size:20px; line-height:1; padding:6px 10px; border:1px solid var(--navy); background:#fff; color:var(--navy); border-radius:4px; cursor:pointer; }
    #side { width:280px; max-width:85vw; flex:0 0 auto; max-height:none; position:fixed; top:0; left:0; bottom:0; z-index:30; transform:translateX(-102%); transition:transform .22s ease; box-shadow:0 0 24px rgba(0,0,0,.35); }
    #side.open { transform:translateX(0); }
    #side .brand { position:relative; padding-right:48px; }
    #closeBtn { display:block; position:absolute; top:14px; right:10px; background:none; border:0; color:#fff; font-size:20px; line-height:1; cursor:pointer; padding:4px 8px; }
    #scrim.show { display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; }
    #main { flex:1; min-height:0; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><h1>Tag <span>Hub</span></h1><p>TAIG — one place for the four.</p><button id="closeBtn" type="button" aria-label="Close menu">✕</button></div>
    <nav id="nav"></nav>
    <div class="note">The Hive may ask you to sign in — sign in once, it remembers you.<br><br>When you ask Muse for something in here, he points you to the exact spot instead of answering in chat. That is the rule.</div>
  </aside>
  <div id="scrim"></div>
  <div id="main">
    <div id="topbar">
      <button id="menuBtn" type="button" aria-label="Open menu">☰</button>
      <span id="crumb">Tag Hub</span>
      <input id="deeplink" readonly value="">
      <button id="copyBtn" type="button">Copy link</button>
    </div>
    <div id="pane">
      <iframe id="viewer" title="Tag Hub viewer"></iframe>
      <div id="storeview"><div class="wrap" id="storewrap"></div></div>
    </div>
  </div>
</div>
<script>
(function () {
  var HUB = "https://taigtsp.duckdns.org";
  var BUBBLES = [
    { id:"business-overview", label:"Business overview", tile:"Business review", url:HUB+"/business-dashboard/",
      subs:[
        { label:"Today with Muse", anchor:"today" },
        { label:"Needs your word", anchor:"needs" },
        { label:"Jobs board", anchor:"jobs" },
        { label:"Conversations", anchor:"conversations" },
        { label:"Business money", anchor:"money" },
        { label:"Stadium build opportunities", storeSub:"Stadium build opportunities" },
        { label:"Funding Proposals", ext:HUB+"/investor-portfolio/" }
      ] },
    { id:"calendar", label:"TAIG Calendar", tile:"TAIG Calendar", url:HUB+"/taig-calendar/",
      subs:[ { label:"Appointments", storeSub:"Appointments" } ] },
    { id:"loops", label:"Loop report", tile:"Loop report", url:HUB+"/loop-report/",
      subs:[
        { label:"The five groups — today", anchor:"groupsTitle" },
        { label:"Every loop, by group and bucket", anchor:"lists" },
        { label:"History — day by day", anchor:"trend" },
        { label:"Close to closing", storeSub:"Close to closing" }
      ] },
    { id:"hive", label:"The Hive", tile:"My hive account", url:HUB+"/hive-portal/",
      subs:[ { label:"TagSpeed PIO #39", href:HUB+"/hive-portal/u/tee/pio/pio/view?id=39" } ] }
  ];
  var LEAGUES = [
    { sport:"soccer", league:"eng.1", label:"Premier League" },
    { sport:"soccer", league:"esp.1", label:"La Liga" },
    { sport:"soccer", league:"ita.1", label:"Serie A" },
    { sport:"football", league:"nfl", label:"NFL" },
    { sport:"football", league:"college-football", label:"College Football" }
  ];
  var TEAMS = [
    { name:"Chelsea", sport:"soccer", league:"eng.1", id:"363" },
    { name:"Leeds United", sport:"soccer", league:"eng.1", id:"357" },
    { name:"Manchester United", sport:"soccer", league:"eng.1", id:"360" },
    { name:"Barcelona", sport:"soccer", league:"esp.1", id:"83" },
    { name:"AC Milan", sport:"soccer", league:"ita.1", id:"103" },
    { name:"Como", sport:"soccer", league:"ita.1", id:"2572" },
    { name:"Jacksonville Jaguars", sport:"football", league:"nfl", id:"30" },
    { name:"NC State Wolfpack", sport:"football", league:"college-football", id:"152" }
  ];
  var store = { objects: [] };
  var sportsCache = null, sportsLoading = false;
  var nav = document.getElementById("nav");
  var side = document.getElementById("side");
  var scrim = document.getElementById("scrim");
  var menuBtn = document.getElementById("menuBtn");
  var closeBtn = document.getElementById("closeBtn");

  /* ---------- mobile menu: nav hides behind the hamburger (mobile only) ---------- */
  function isMobile(){ return window.innerWidth <= 760; }
  function openMenu(){ side.classList.add("open"); scrim.classList.add("show"); }
  function closeMenu(){ side.classList.remove("open"); scrim.classList.remove("show"); }
  if (menuBtn) menuBtn.addEventListener("click", openMenu);
  if (closeBtn) closeBtn.addEventListener("click", closeMenu);
  if (scrim) scrim.addEventListener("click", closeMenu);
  document.addEventListener("keydown", function (e){ if (e.key === "Escape") closeMenu(); });
  if (nav) nav.addEventListener("click", function (e){
    var a = e.target && e.target.closest ? e.target.closest("a") : null;
    if (a && isMobile()) closeMenu();
  });
  var viewer = document.getElementById("viewer");
  var storeview = document.getElementById("storeview");
  var storewrap = document.getElementById("storewrap");
  var crumb = document.getElementById("crumb");
  var deeplink = document.getElementById("deeplink");

  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function bubble(id){ for (var i=0;i<BUBBLES.length;i++) if (BUBBLES[i].id===id) return BUBBLES[i]; return null; }
  function objById(id){ for (var i=0;i<store.objects.length;i++) if (store.objects[i].id===id) return store.objects[i]; return null; }
  function fmtDate(iso){
    if (!iso) return "";
    var d = new Date(iso.length===10 ? iso+"T12:00:00" : iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric", timeZone:"America/New_York" });
  }

  function buildNav(activeBubble){
    var h = '<div class="nav-label">Tag Hub</div>';
    h += '<a href="#/landing" data-route="landing">Landing</a>';
    BUBBLES.forEach(function (b){
      h += '<div class="nav-label">'+esc(b.label)+'</div>';
      h += '<a href="#/'+b.id+'" data-bubble="'+b.id+'"'+(activeBubble===b.id?' class="active"':"")+'>'+esc(b.label)+'</a>';
      b.subs.forEach(function (s){
        if (s.storeSub) {
          h += '<a class="sub" href="#/'+b.id+'/'+slug(s.storeSub)+'">'+esc(s.label)+'</a>';
        } else if (s.ext) {
          h += '<a class="sub" href="'+esc(s.ext)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>';
        } else if (s.href) {
          h += '<a class="sub" href="#/hive/pio/39">'+esc(s.label)+'</a>';
        } else {
          h += '<a class="sub" href="#/'+b.id+'/'+s.anchor+'">'+esc(s.label)+'</a>';
        }
      });
      store.objects.filter(function (o){ return o.bubble===b.id; }).forEach(function (o){
        h += '<a class="filed" href="#/object/'+o.id+'">'+esc(o.title)+'</a>';
      });
    });
    nav.innerHTML = h;
  }

  function cardHTML(o){
    var h = '<div class="card"><h3><a href="#/object/'+o.id+'">'+esc(o.title)+'</a></h3>';
    h += '<p class="truth">'+esc(o.truth)+'</p>';
    h += '<div class="meta"><b>'+esc(bubble(o.bubble)?bubble(o.bubble).label:o.bubble)+'</b> · '+esc(o.subItem)+' · Source: '+esc(o.source)+' · Updated '+esc(o.updated)+'</div>';
    h += '<div class="links"><a class="open" href="'+esc(o.link)+'" target="_blank" rel="noopener">Open the spot →</a>';
    h += '<button type="button" data-copy="'+HUB+'/tag-hub/#/object/'+o.id+'">Copy deep link</button></div>';
    if (o.revisions && o.revisions.length) {
      h += '<div class="revs"><h4>Corrections — history kept</h4>';
      o.revisions.forEach(function (r){
        h += '<div class="rev"><span class="tag">'+esc(r.kind||"correction")+'</span>'+esc(r.date||"")+' — was <s>'+esc(r.from||"")+'</s> → now <b>'+esc(r.to||"")+'</b>'+(r.note?' — '+esc(r.note):"")+'</div>';
      });
      h += '</div>';
    }
    h += '</div>';
    return h;
  }

  function showStore(html, crumbText){
    viewer.classList.add("hide");
    storeview.classList.add("show");
    storewrap.innerHTML = html;
    crumb.textContent = crumbText;
    deeplink.value = location.href;
  }
  function showFrame(src, crumbText){
    storeview.classList.remove("show");
    viewer.classList.remove("hide");
    if (viewer.getAttribute("src") !== src) viewer.setAttribute("src", src);
    crumb.textContent = crumbText;
    deeplink.value = location.href;
  }

  /* ---------- sports: personal feed, direct from ESPN in the browser.
     The public Sports Report stays news-off (v12) — this touches nothing there. ---------- */
  function fetchJSON(url, ms){
    var c = new AbortController();
    var t = setTimeout(function(){ c.abort(); }, ms || 8000);
    return fetch(url, { signal:c.signal }).then(function (r){
      clearTimeout(t);
      if (!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    }).catch(function (e){ clearTimeout(t); throw e; });
  }
  function loadSports(){
    if (sportsCache || sportsLoading) return;
    sportsLoading = true;
    var newsJobs = LEAGUES.map(function (L){
      return fetchJSON("https://site.api.espn.com/apis/site/v2/sports/"+L.sport+"/"+L.league+"/news?limit=6")
        .then(function (d){ return { league:L, articles:(d.articles||[]).slice(0,6) }; })
        .catch(function (){ return { league:L, articles:[], failed:true }; });
    });
    var teamJobs = TEAMS.map(function (T){
      return fetchJSON("https://site.api.espn.com/apis/site/v2/sports/"+T.sport+"/"+T.league+"/teams/"+T.id+"/schedule")
        .then(function (d){ return { team:T, next:nextFixture(d) }; })
        .catch(function (){ return { team:T, next:null, failed:true }; });
    });
    Promise.all([Promise.all(newsJobs), Promise.all(teamJobs)]).then(function (res){
      sportsCache = { news:res[0], teams:res[1] };
      sportsLoading = false;
      paintSports();
    }).catch(function (){
      sportsCache = { news:[], teams:[] };
      sportsLoading = false;
      paintSports();
    });
  }
  function nextFixture(d){
    try {
      var evs = d.events || [];
      var now = Date.now();
      for (var i=0;i<evs.length;i++){
        var ev = evs[i];
        var dt = new Date(ev.date).getTime();
        if (isNaN(dt) || dt < now - 86400000) continue;
        var comp = (ev.competitions||[])[0] || {};
        var cs = comp.competitors || [];
        var home = null, away = null;
        cs.forEach(function (c){ if (c.homeAway==="home") home=c; if (c.homeAway==="away") away=c; });
        if (!home || !away) continue;
        return { date:ev.date,
          home:(home.team||{}).displayName||"", away:(away.team||{}).displayName||"",
          comp:((comp.details||{}).league||"") || ev.seasonType || "" };
      }
    } catch (e) {}
    return null;
  }
  function fmtWhen(iso){
    try {
      var d = new Date(iso);
      return d.toLocaleString("en-US", { weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZone:"America/New_York" });
    } catch (e) { return iso; }
  }
  function paintSports(){
    var el;
    if (!sportsCache) return;
    el = document.getElementById("sport-teams");
    if (el) {
      var h = "";
      sportsCache.teams.forEach(function (t){
        if (t.next) {
          h += '<div class="fixture"><b>'+esc(t.next.away)+' vs '+esc(t.next.home)+'</b><br><span class="when">'+esc(fmtWhen(t.next.date))+(t.next.comp?' · '+esc(t.next.comp):"")+'</span></div>';
        } else {
          h += '<div class="fixture"><b>'+esc(t.team.name)+'</b><br><span class="when">Next fixture not loaded — check connection.</span></div>';
        }
      });
      el.innerHTML = h || '<p class="empty">No fixtures loaded.</p>';
    }
    el = document.getElementById("sport-leagues");
    if (el) {
      var g = "";
      sportsCache.news.forEach(function (n){
        g += '<div class="sport-sub">'+esc(n.league.label)+'</div>';
        if (!n.articles.length) { g += '<p class="empty">No headlines loaded.</p>'; return; }
        n.articles.slice(0,3).forEach(function (a){
          var href = (a.links && a.links.web && a.links.web.href) || "#";
          g += '<div class="news-item"><a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(a.headline||"")+'</a></div>';
        });
      });
      el.innerHTML = g || '<p class="empty">No headlines loaded.</p>';
    }
    el = document.getElementById("sport-latest");
    if (el) {
      var all = [];
      sportsCache.news.forEach(function (n){
        (n.articles||[]).forEach(function (a){
          all.push({ h:a.headline||"", href:(a.links&&a.links.web&&a.links.web.href)||"#", pub:a.published||"", league:n.league.label });
        });
      });
      all.sort(function (a,b){ return new Date(b.pub) - new Date(a.pub); });
      var m = "";
      all.slice(0,8).forEach(function (a){
        m += '<div class="news-item"><a href="'+esc(a.href)+'" target="_blank" rel="noopener">'+esc(a.h)+'</a><br><span class="src">'+esc(a.league)+(a.pub?' · '+esc(fmtDate(a.pub)):"")+'</span></div>';
      });
      el.innerHTML = m || '<p class="empty">No headlines loaded — check connection.</p>';
    }
  }

  /* ---------- landing ---------- */
  function latestFor(bid){
    var objs = store.objects.filter(function (o){ return o.bubble===bid; });
    if (!objs.length) return null;
    objs.sort(function (a,b){ return (b.updated||"") < (a.updated||"") ? -1 : 1; });
    return objs[0];
  }
  function renderLanding(){
    var attn = store.objects.filter(function (o){ return o.needsAttention; });
    var h = '<h2>Tag Hub</h2><p class="lede">Your landing — calendar, what needs you, your sports, and your portfolios.</p>';
    h += '<div class="landing"><div>';
    h += '<div class="panel"><h3>TAIG Calendar</h3><p class="sub">Your calendar, right here.</p>';
    h += '<iframe class="cal-frame" src="'+HUB+'/taig-calendar/" title="TAIG Calendar"></iframe>';
    h += '<p class="foot"><a href="#/calendar">Open full calendar →</a></p></div>';
    h += '<div class="panel"><h3>The things that need my attention</h3><p class="sub">Close-to-closing, grouped by bubble. Open one and it takes you to the exact spot.</p>';
    if (!attn.length) { h += '<p class="empty">Nothing needs you right now.</p>'; }
    BUBBLES.forEach(function (b){
      var items = attn.filter(function (o){ return o.bubble===b.id; });
      if (!items.length) return;
      h += '<div class="attn-group"><h4>'+esc(b.label)+'</h4>';
      items.forEach(function (o){
        h += '<div class="attn-item"><a class="t" href="#/object/'+o.id+'">'+esc(o.title)+'</a><p>'+esc(o.attentionNote||o.truth)+'</p></div>';
      });
      h += '</div>';
    });
    h += '</div>';
    h += '<div class="panel"><h3>Latest sports news</h3><p class="sub">Just for you — the public Sports Report stays news-off. Headlines link out to ESPN.</p>';
    h += '<div class="sport-sub">My teams — next up</div><div id="sport-teams"><p class="empty">Loading fixtures…</p></div>';
    h += '<div class="sport-sub">My sports</div><div id="sport-leagues"><p class="empty">Loading headlines…</p></div>';
    h += '<div class="sport-sub">Latest sports news</div><div id="sport-latest"><p class="empty">Loading headlines…</p></div>';
    h += '</div>';
    h += '</div><div>';
    h += '<a class="port-card" href="'+HUB+'/resumes/" target="_blank" rel="noopener"><b>Portfolios</b><span>Sanil D. Tison — Resume · Me and My Goals. The portfolio you send employers.</span><span class="go">Open portfolios →</span></a>';
    h += '<div class="panel"><h3>The other main bubbles</h3><p class="sub">Tiles, with dates.</p>';
    ["business-overview","loops","hive"].forEach(function (bid){
      var b = bubble(bid);
      var latest = latestFor(bid);
      var date = latest ? fmtDate(latest.updated) : "";
      h += '<a class="tile" href="#/'+bid+'"><b>'+esc(b.tile)+'</b><span class="date">'+(date?("Updated "+esc(date)):"")+'</span>'+(latest?'<span class="latest">'+esc(latest.title)+'</span>':"")+'</a>';
    });
    h += '</div>';
    h += '</div></div>';
    showStore(h, "Tag Hub / Landing");
    loadSports();
    if (sportsCache) paintSports();
  }
  function renderObject(id){
    var o = objById(id);
    if (!o) { renderLanding(); return; }
    var b = bubble(o.bubble);
    var h = '<h2>'+esc(o.title)+'</h2><p class="lede">'+esc(b?b.label:o.bubble)+' · '+esc(o.subItem)+'</p>';
    h += cardHTML(o);
    h += '<p><a href="#/landing">← Back to Landing</a> · <a href="#/'+o.bubble+'">Open '+esc(b?b.label:o.bubble)+'</a></p>';
    showStore(h, "Tag Hub / "+(b?b.label:o.bubble)+" / "+o.title);
  }
  function renderFiltered(bid, subSlug){
    var b = bubble(bid);
    var objs = store.objects.filter(function (o){ return o.bubble===bid && slug(o.subItem)===subSlug; });
    var label = objs.length ? objs[0].subItem : subSlug;
    var h = '<h2>'+esc(label)+'</h2><p class="lede">'+esc(b?b.label:bid)+' — filed here, under this bubble.</p>';
    if (!objs.length) h += '<p class="empty">Nothing filed under this yet.</p>';
    objs.forEach(function (o){ h += cardHTML(o); });
    if (b) h += '<p><a href="#/'+bid+'">Open '+esc(b.label)+' →</a></p>';
    showStore(h, "Tag Hub / "+(b?b.label:bid)+" / "+label);
  }

  function route(){
    if (isMobile()) closeMenu();
    var raw = (location.hash||"").replace(/^#\/?/,"");
    var parts = raw.split("/").filter(Boolean);
    if (!parts.length || parts[0]==="landing" || parts[0]==="today") { renderLanding(); buildNav(null); return; }
    if (parts[0]==="object" && parts[1]) { renderObject(parts[1]); buildNav(null); return; }
    var b = bubble(parts[0]);
    if (!b) { renderLanding(); buildNav(null); return; }
    if (parts.length===1) { showFrame(b.url, "Tag Hub / "+b.label); buildNav(b.id); return; }
    if (b.id==="hive" && parts[1]==="pio" && parts[2]) {
      showFrame(HUB+"/hive-portal/u/tee/pio/pio/view?id="+parts[2], "Tag Hub / The Hive / PIO #"+parts[2]);
      buildNav(b.id); return;
    }
    var second = parts[1];
    var storeMatch = store.objects.some(function (o){ return o.bubble===b.id && slug(o.subItem)===second; });
    if (storeMatch) { renderFiltered(b.id, second); buildNav(b.id); return; }
    var anchorKnown = b.subs.some(function (s){ return s.anchor===second; });
    if (anchorKnown) { showFrame(b.url+"#"+second, "Tag Hub / "+b.label); buildNav(b.id); return; }
    showFrame(b.url, "Tag Hub / "+b.label); buildNav(b.id);
  }

  document.addEventListener("click", function (e){
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute("data-copy")) {
      var txt = t.getAttribute("data-copy");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function(){ t.textContent = "Copied"; setTimeout(function(){ t.textContent = "Copy deep link"; }, 1500); });
      } else {
        var tmp = document.createElement("input"); tmp.value = txt; document.body.appendChild(tmp); tmp.select();
        try { document.execCommand("copy"); t.textContent = "Copied"; } catch (err) {}
        document.body.removeChild(tmp);
      }
    }
  });
  document.getElementById("copyBtn").addEventListener("click", function (){
    var btn = this;
    var txt = deeplink.value || location.href;
    function done(){ btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = "Copy link"; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(done); }
    else { deeplink.select(); try { document.execCommand("copy"); } catch (err) {} done(); }
  });

  fetch("store.json").then(function (r){ return r.json(); }).then(function (j){
    store = j; route();
  }).catch(function (){
    store = { objects: [] }; route();
  });
  window.addEventListener("hashchange", route);
})();
</script>
</body>
</html>
